- id: object-detection
  targets:
  - cv
  - portfolio
  title: Application of the LoRA on Object Detection model
  technologies:
  - Python
  - PyTorch
  - Transformer
  - LoRA
  - Git
  portfolio:
    items:
    - parts:
      - type: text
        value: This research project was conducted in collaboration with a PhD student from Sorbonne University.
          The objective was to explore the application of LoRA (Low-Rank Adaptation) to enhance the performance
          of DiffusionDet, an object detection model, under few-shot learning conditions. The goal was
          to evaluate whether LoRA can effectively adapt the model to new object categories using limited
          annotated data, improving efficiency and generalization in low-resource scenarios.
    - parts:
      - type: text
        value: We applied this approach to aerial imagery datasets, specifically DOTA (Dataset for Object
          Detection in Aerial Images) and DIOR (Dataset for Object Recognition in Aerial Images). These
          datasets contain complex scenes with multiple object classes captured from aerial perspectives,
          making them ideal for evaluating few-shot object detection in real-world scenarios.
    - parts:
      - type: text
        value: 'The paper can be found here:'
      - type: link
        label: Preprint, arXiv:2504.06330
        url: https://arxiv.org/abs/2504.06330
  cv:
    order: 30
    title: Applying LoRA to Object Detection Model (IEEE)
    dates: January 2025 -- March 2025
    items:

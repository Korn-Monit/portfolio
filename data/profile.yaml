- id: handmotion-prediction
  targets:
  - portfolio
  title: HandMotion Prediction
  technologies:
  - Python
  - Data Analysis
  - PyTorch
  - Time-series
  - Git
  items:
  - parts:
    - type: text
      value: Developing a machine learning project to predict the acceleration of patients hands, providing
        one prediction per second for each hand from 7 AM to 7 PM. The dataset contains acceleration values
        (x, y, z) for both hands and corresponding timestamps, with 50 data points recorded per second.
        Responsibilities include synchronizing datasets for both hands by aligning timestamps, handling
        missing data through linear interpolation, and training a Long Short-Term Memory (LSTM) model
        to produce accurate, second-level predictions.
- id: e-commerce
  targets:
  - portfolio
  title: E-Commerce Web application
  technologies:
  - JavaScript
  - PHP
  - Vue.js
  - Laravel
  - HTML
  - CSS
  - Tailwind
  - Git
  items:
  - parts:
    - type: text
      value: Developed a web application for sports shoe sales using a Vue.js frontend and a Laravel backend.
        The frontend, built with Vue.js, provided a dynamic and responsive user interface, enabling users
        to browse products, filter by size, brand, and category, and manage their shopping cart in real
        time. The backend, powered by Laravel, handled key functionalities such as user authentication,
        product management, inventory tracking, order processing, and payment integration. The system
        also included an admin dashboard for managing product listings, viewing sales analytics, and handling
        customer queries. The application aimed to deliver a seamless e-commerce experience optimized
        for both desktop and mobile users.
- id: cafe-system
  targets:
  - portfolio
  title: Café System
  technologies:
  - Java
  - Spring Boot
  - HTML
  - CSS
  - Tailwind
  - JavaScript
  - Git
  items:
  - parts:
    - type: text
      value: Developed a Point of Sale (POS) management system for a café using Java and the Spring Boot
        backend framework. The system was designed to streamline daily operations by managing orders,
        inventory, tables, billing, and staff roles. Key features included real-time order tracking, digital
        receipts, menu management, and role-based access for cashiers and administrators. The backend
        was built with Spring Boot to ensure scalability, modularity, and efficient API handling. The
        application aimed to improve service speed, reduce human error, and provide insightful sales reports
        for business analysis.
- id: air-writing
  targets:
  - portfolio
  title: Air Writing
  technologies:
  - Python
  - PyTorch
  - Git
  items:
  - parts:
    - type: text
      value: Collected and prepared Khmer dataset to train and fine-tune an existing machine learning
        model with the goal of improving its prediction accuracy. The process involved data cleaning,
        augmentation, and labeling to ensure high-quality input. The model was retrained using the updated
        dataset, followed by performance evaluation through metrics such as accuracy, precision, recall,
        and F1-score. This iterative process helped enhance the model’s generalization and reliability
        in real-world scenarios.
